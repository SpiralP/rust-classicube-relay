name: install-build-test
description: "Install rust, build, and test with nextest for the given target."

inputs:
  target:
    description: Build target.
    required: true

runs:
  using: composite
  steps:
    - name: Install rust
      run: |
        rustup default stable
        rustup target add ${{ inputs.target }}
      shell: bash

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.target }}
        save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Build
      run: cargo build --target ${{ inputs.target }}
      shell: bash

    - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
      with:
        tool: cargo-nextest

    - name: Test
      run: cargo nextest run --target ${{ inputs.target }} --features ci --no-capture
      shell: bash
